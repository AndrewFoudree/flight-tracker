defaults:
  passengers:
    adults: 2
    children: 4          # ages 2 to 11
    infants: 1           # under 2 at the time of travel, lap infant
    # Lap-infant eligibility depends on the flight date, not today. Fill this in
    # and the tracker prices a seat automatically from the trip where he turns
    # two. Until it is set, the count above is taken on trust and the run warns.
    # infant_birthdates: ["2025-05-20"]
  currency: USD
  cabin: economy
  sources: [serpapi, travelpayouts]
  # Flexible-date routes are expanded into one search per step through the
  # window. Raising this number lowers SerpAPI cost per run.
  window_step_days: 7
  # Lap-infant share of an adult fare, used only by the split-booking estimate.
  # 0 is correct for domestic US; international is typically around 10.
  infant_fare_pct: 0

budget:
  serpapi_monthly_searches: 250
  reserve: 20            # stop before hitting zero

routes:
  # Chosen from the year survey, not guessed. $2,955 total is a hard floor for
  # this route and party ($492 a seat); nothing in 61 sampled departures beat it.
  # January hits that floor repeatedly, so the window tracks the whole month and
  # reports whichever day is cheapest rather than betting on one date.
  - id: dsm-stt-january
    origin: DSM
    destination: STT   # St. Thomas, US Virgin Islands
    depart_window:
      earliest: "2027-01-03"   # after the New Year spike; Dec 25 hit $6,969
      latest: "2027-01-31"
    nights: 7
    window_step_days: 7        # 5 departures a run, 150 searches a month
    threshold_usd: 2800        # below the observed floor, so it means something
    alert_on:
      - absolute_below: 2800   # a genuine break below the floor
      - lowest_in_days: 30
      - percent_drop: 5
    # The party and single-adult probe were within $3, so the fare buckets are
    # deep. Re-enable if the window narrows to a fixed date.
    compare_split_booking: false
