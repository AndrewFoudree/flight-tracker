defaults:
  passengers:
    adults: 2
    children: 4          # ages 2 to 11
    infants: 1           # under 2 at the time of travel, lap infant
    # Lap-infant eligibility depends on the flight date, not today. Fill this in
    # and the tracker prices a seat automatically from the trip where he turns
    # two. Until it is set, the count above is taken on trust and the run warns.
    # infant_birthdates: ["2025-05-20"]
  currency: USD
  cabin: economy
  sources: [serpapi, travelpayouts]
  # Flexible-date routes are expanded into one search per step through the
  # window. Raising this number lowers SerpAPI cost per run.
  window_step_days: 7
  # Lap-infant share of an adult fare, used only by the split-booking estimate.
  # 0 is correct for domestic US; international is typically around 10.
  infant_fare_pct: 0

budget:
  serpapi_monthly_searches: 250
  reserve: 20            # stop before hitting zero

routes:
  # Chosen from a full sweep of all 31 January departures at 4, 5 and 7 nights.
  # $2,955 ($492 a seat) is a hard floor this route keeps returning to, and it is
  # reachable at every trip length, so a shorter trip costs nothing. Several
  # January dates tie at that floor; this one departs on a Saturday, sits in the
  # coldest part of Iowa winter, and clears the volatile New Year window.
  - id: dsm-stt-jan
    origin: DSM
    destination: STT   # St. Thomas, US Virgin Islands
    depart: "2027-01-23"       # Saturday
    return: "2027-01-28"       # Thursday, 5 nights
    threshold_usd: 2800        # below the observed floor, so an alert means something
    alert_on:
      - absolute_below: 2800   # a genuine break below the floor
      - lowest_in_days: 30
      - percent_drop: 5
    # A fixed date costs 1 search a run, so the single-adult probe fits again.
    # It measures fare-bucket depth: when group total starts exceeding 6x single,
    # the cheap seats are draining and it is time to book.
    compare_split_booking: true
