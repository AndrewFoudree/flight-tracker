defaults:
  passengers:
    # The split lives in the PARTY repository variable, formatted
    # "adults,children,infants", because this file is public and who is in a
    # household is not something to publish. The full split still reaches the
    # API: children price separately from adults and a lap infant has to be
    # declared. Only the seat count is ever written down.
    # A missing PARTY fails the run rather than pricing a different party.
    from_env: PARTY
  currency: USD
  cabin: economy
  sources: [serpapi, travelpayouts]
  # Flexible-date routes are expanded into one search per step through the
  # window. Raising this number lowers SerpAPI cost per run.
  window_step_days: 7
  # Lap-infant share of an adult fare, used only by the split-booking estimate.
  # 0 is correct for domestic US; international is typically around 10.
  infant_fare_pct: 0

budget:
  serpapi_monthly_searches: 250
  reserve: 20            # stop before hitting zero
  # Worst case is a month holding five Sundays: 32 searches a run x 5 = 160,
  # inside the 230 spendable. Sized to fit every month, not the average one.
  # 28 of the 32 go to January, which is the window being bought; April/May is a
  # 4-search baseline until it becomes primary in December. The 70 spare is
  # deliberate headroom for the backlog -- one-way legs, a day either side of
  # each target, further origins -- which is added one item at a time.

routes:
  # Order is load-bearing. When a cycle runs short the guard funds routes in the
  # order they appear and records NA for the rest, so the order runs from what is
  # being bought to what is only a reference: January before the shoulder, and the
  # two destinations paired at every level so a short cycle degrades both alike
  # instead of blinding one of them.

  # Caribbean leisure capacity runs on a Saturday turnaround, so the cheap bucket
  # should be deepest Sat -> Sat. The survey backs this for January: Saturday was
  # the best day of the month, 4 of 5 on the $2,955 floor against Thursday's 3 of
  # 4. Pooled over the whole year Saturday ranks near the bottom, so this is a
  # January effect, not a general one -- which is why it runs beside the Thursday
  # route rather than replacing it. Both legs land on the turnaround: 7 nights.
  # This is the likeliest route to be booked, so it keeps the single-adult probe.
  - id: dsm-stt-jan-saturdays
    origin: DSM
    destination: STT
    depart_window:
      earliest: "2027-01-02"
      latest: "2027-01-30"
    nights: 7
    window_step_days: 7
    threshold_usd: 2800
    alert_on:
      - absolute_below: 2800
      - lowest_in_days: 30
      - percent_drop: 5
    # 5 dates x 2 = 10 a run.
    compare_split_booking: true

  # San Juan, the same window and shape as the St. Thomas route above so the two
  # destinations are read side by side. No survey has ever run on SJU, so nothing
  # here is evidence-led yet; it keeps the probe for the same reason STT does.
  # SJU is a far larger airport with mainland capacity STT does not have, which is
  # exactly the six-seats-in-one-bucket problem this tracker exists to measure.
  # No absolute_below until there is a baseline: the $2,800 bar is calibrated to
  # the STT floor and would either fire every week here or never.
  - id: dsm-sju-jan-saturdays
    origin: DSM
    destination: SJU
    depart_window:
      earliest: "2027-01-02"
      latest: "2027-01-30"
    nights: 7
    window_step_days: 7
    # $2,796 is San Juan's bucket floor, hit on three of four January Thursdays
    # by two carriers on 2026-09-01. A bar at $2,800 would fire every week and
    # mean nothing; $2,700 fires only on a genuine break below the bucket. The
    # drawn threshold matches the alert bar so the chart and the alert agree.
    threshold_usd: 2700
    alert_on:
      - absolute_below: 2700
      - lowest_in_days: 30
      - percent_drop: 5
    # 5 dates x 2 = 10 a run.
    compare_split_booking: true

  # January was the cheapest month of the year: median $2,970 against $3,058 to
  # $3,201 elsewhere, and the most days sitting on the $2,955 floor. Thu -> Tue
  # is 5 nights; the window steps 7 days so it lands on all four January
  # Thursdays and nothing else. Party fare only now -- Saturday out-floors it in
  # January, so the probe follows the Saturday route.
  - id: dsm-stt-jan-thursdays
    origin: DSM
    destination: STT
    depart_window:
      earliest: "2027-01-07"
      latest: "2027-01-28"
    nights: 5
    window_step_days: 7
    threshold_usd: 2800
    alert_on:
      - absolute_below: 2800
      - lowest_in_days: 30
      - percent_drop: 5
    # 2 dates x 1 = 2 a run. A baseline, not a search: it exists so a January
    # price can be judged as genuinely low rather than only low for January.
    # Full resolution comes back when this window becomes primary in December.
    compare_split_booking: false

  # San Juan, January midweek. Party fare only, as above.
  - id: dsm-sju-jan-thursdays
    origin: DSM
    destination: SJU
    depart_window:
      earliest: "2027-01-07"
      latest: "2027-01-28"
    nights: 5
    window_step_days: 7
    # $2,796 is San Juan's bucket floor, hit on three of four January Thursdays
    # by two carriers on 2026-09-01. A bar at $2,800 would fire every week and
    # mean nothing; $2,700 fires only on a genuine break below the bucket. The
    # drawn threshold matches the alert bar so the chart and the alert agree.
    threshold_usd: 2700
    alert_on:
      - absolute_below: 2700
      - lowest_in_days: 30
      - percent_drop: 5
    # 2 dates x 1 = 2 a run. A baseline, not a search: it exists so a January
    # price can be judged as genuinely low rather than only low for January.
    # Full resolution comes back when this window becomes primary in December.
    compare_split_booking: false

  # A second look at the shoulder season. The year survey put April's median at
  # $2,985, level with January, and late April sat on the $2,955 floor on four of
  # five sampled departures; early May is patchier ($3,120 median) but May 4 and
  # May 11 both hit the floor.
  - id: dsm-stt-apr-may-thursdays
    origin: DSM
    destination: STT
    depart_window:
      earliest: "2027-04-29"   # one representative Thursday in April
      latest: "2027-05-13"     # one in May
    nights: 5                  # Thursday -> Tuesday
    window_step_days: 14       # exactly two dates: Apr 29 and May 13
    threshold_usd: 2800
    alert_on:
      - absolute_below: 2800
      - lowest_in_days: 30
      - percent_drop: 5
    # 2 dates x 1 = 2 a run. A baseline, not a search: it exists so a January
    # price can be judged as genuinely low rather than only low for January.
    # Full resolution comes back when this window becomes primary in December.
    compare_split_booking: false

  # San Juan, shoulder midweek. The thinnest cell in the grid: new destination,
  # secondary window, weakest weekday. First to lose its searches to a short
  # cycle, and the first thing to cut if the plan ever needs the headroom.
  - id: dsm-sju-apr-may-thursdays
    origin: DSM
    destination: SJU
    depart_window:
      earliest: "2027-04-29"   # one representative Thursday in April
      latest: "2027-05-13"     # one in May
    nights: 5                  # Thursday -> Tuesday
    window_step_days: 14       # exactly two dates: Apr 29 and May 13
    # $2,796 is San Juan's bucket floor, hit on three of four January Thursdays
    # by two carriers on 2026-09-01. A bar at $2,800 would fire every week and
    # mean nothing; $2,700 fires only on a genuine break below the bucket. The
    # drawn threshold matches the alert bar so the chart and the alert agree.
    threshold_usd: 2700
    alert_on:
      - absolute_below: 2700
      - lowest_in_days: 30
      - percent_drop: 5
    # 2 dates x 1 = 2 a run. A baseline, not a search: it exists so a January
    # price can be judged as genuinely low rather than only low for January.
    # Full resolution comes back when this window becomes primary in December.
    compare_split_booking: false
