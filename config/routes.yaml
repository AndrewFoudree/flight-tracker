defaults:
  passengers:
    # The split lives in the PARTY repository variable, formatted
    # "adults,children,infants", because this file is public and who is in a
    # household is not something to publish. The full split still reaches the
    # API: children price separately from adults and a lap infant has to be
    # declared. Only the seat count is ever written down.
    # A missing PARTY fails the run rather than pricing a different party.
    from_env: PARTY
  currency: USD
  cabin: economy
  sources: [serpapi, travelpayouts]
  # Flexible-date routes are expanded into one search per step through the
  # window. Raising this number lowers SerpAPI cost per run.
  window_step_days: 7
  # Lap-infant share of an adult fare, used only by the split-booking estimate.
  # 0 is correct for domestic US; international is typically around 10.
  infant_fare_pct: 0

budget:
  serpapi_monthly_searches: 250
  # Normally 20, to stop before hitting zero. Set to 0 on 2026-09-13 to spend the
  # cycle's last 6 searches on one reading of the first route; put it back to 20
  # when the plan renews (expected around 2026-09-30).
  reserve: 0
  # Worst case is a month holding five Sundays: 41 searches a run x 5 = 205,
  # inside the 230 spendable. Sized to fit every month, not the average one.
  # 28 of the 41 go to DSM January, which is the window being bought; April/May
  # is a 4-search baseline until it becomes primary in December; the 8 drive-to-
  # a-hub searches added 2026-09-24 are a comparison, not a search.
  #
  # That spare was 70 before the hub routes and is now 25 in a five-Sunday month
  # (66 in a four-Sunday one), so the backlog -- one-way legs, a day either side
  # of each target, further origins -- no longer has room to be added an item at
  # a time without cutting something. If the hub comparison closes either way,
  # ord-stt-jan-sat-thu is the first to drop and returns 3 a run.

# What reaching a non-home origin costs the whole party, round trip, as a RANGE.
# `low` is out-of-pocket only -- fuel, a cheap off-airport lot, tolls. `high`
# adds vehicle wear at the IRS mileage rate and the on-airport economy lot.
#
# The spread is 3.6x and that is the honest width. This is not here to be
# accurate; it is here so a comparison can be checked at both ends. A hub beats
# Des Moines only if it beats it at `high`, and loses only if it loses at `low`.
# Anything between is a conclusion resting on a number nobody can pin down, and
# should be reported undecided rather than settled by picking a midpoint.
#
# Checked 2026-09-24 against the readings of that day, every comparison survived
# the full width: ORD->SJU won by $566 even at `high`, ORD->STT lost by $408
# even at `low`. The number being fuzzy did not change a single answer.
#
# Deliberately NOT used by alerting. Thresholds are calibrated on raw fares and
# mean "cheap for this origin"; folding a drive estimate into them would re-base
# every bar against a figure this block admits it cannot fix. Cross-origin
# comparison is a reporting job.
#
# DSM is absent on purpose: the home airport is free, and a missing entry shows
# no adjustment rather than a guessed one.
origins:
  ORD:
    low: 169                 # 666 mi round trip: ~$90 fuel, ~$70 off-site lot, ~$10 tolls
    high: 611                # IRS 67c/mi ($446) + economy lot 6 days ($150) + tolls
    note: "333 miles each way; a January drive with no missed-connection cover"
  MSP:
    low: 124                 # 488 mi round trip: ~$65 fuel, ~$60 lot
    high: 423                # IRS 67c/mi ($327) + MSP economy 6 days ($96)
    note: "244 miles each way, the shorter drive of the two"

routes:
  # Order is load-bearing. When a cycle runs short the guard funds routes in the
  # order they appear and records NA for the rest, so the order runs from what is
  # being bought to what is only a reference: January before the shoulder, and the
  # two destinations paired at every level so a short cycle degrades both alike
  # instead of blinding one of them.

  # Caribbean leisure capacity runs on a Saturday turnaround, so the cheap bucket
  # should be deepest on a Saturday departure. The survey backs this for January:
  # Saturday was the best day of the month, 4 of 5 on the $2,955 floor against
  # Thursday's 3 of 4. Pooled over the whole year Saturday ranks near the bottom,
  # so this is a January effect, not a general one -- which is why it runs beside
  # the Thursday route rather than replacing it.
  #
  # Out Saturday, back Thursday: 5 nights. Until 2026-09-14 this came back on the
  # Saturday too, 7 nights, because the survey found length free from 4 to 9
  # nights. That stopped holding. Looked up by hand on 2026-09-14, seven seats
  # back on the Thursday were $245 under the Saturday return on all four
  # Saturdays compared ($3,583 against $3,828 on Jan 9, 23 and 30). Seven, not
  # six: the infant was entered in a seat, so those totals carry one extra fare
  # against the party priced here, but the gap between the two returns holds.
  # The party is bound by budget, not by time, so the cheaper flight that also
  # drops two nights of lodging is the trip being bought. The 7-night history
  # stays in prices.csv under the old id, dsm-stt-jan-saturdays.
  # This is the likeliest route to be booked, so it keeps the single-adult probe.
  - id: dsm-stt-jan-sat-thu
    origin: DSM
    destination: STT
    depart_window:
      earliest: "2027-01-02"
      latest: "2027-01-30"
    nights: 5
    window_step_days: 7
    threshold_usd: 2800
    alert_on:
      - absolute_below: 2800
      - lowest_in_days: 30
      - percent_drop: 5
    # 5 dates x 2 = 10 a run.
    compare_split_booking: true
    # The $2,796 and $2,955 floors these bars came from were fares stating
    # "Checked baggage for a fee", i.e. a cabin bag included. A Basic fare
    # must not clear them.
    threshold_basis: bag_inclusive

  # San Juan, the same window and shape as the St. Thomas route above so the two
  # destinations are read side by side. No survey has ever run on SJU, so nothing
  # here is evidence-led yet; it keeps the probe for the same reason STT does.
  # It moved to 5 nights with STT on 2026-09-14 for the lodging, not on San Juan
  # evidence: no SJU Thursday return had been priced. Old id dsm-sju-jan-saturdays.
  # SJU is a far larger airport with mainland capacity STT does not have, which is
  # exactly the six-seats-in-one-bucket problem this tracker exists to measure.
  #
  # There is a baseline now, so the bar below is anchored rather than borrowed.
  # Recalibrated 2026-09-09 from $2,700 to $2,650: 5.25% below San Juan's own
  # $2,796 bucket floor (three of four January Thursdays, two carriers, on
  # 2026-09-01), which is the same relative break STT's $2,800 asks of its own
  # $2,955 floor. At $2,700 SJU was asked for 3.43% against STT's 5.25%, and
  # these two are meant to be held to one standard.
  #
  # Not a loosening, and not a fix for a bar that misfired: neither bar has ever
  # fired, on any departure, for either destination.
  #
  # In market terms this is still the easier bar. $442 a seat is around the 30th
  # percentile of what DSM-SJU actually charged; STT's $467 sits below its 10th
  # (data/fare_baseline.json). That gap is real and not worth chasing -- San Juan
  # has cheap individual inventory, Frontier among it, that six seats in one
  # bucket cannot reach. Closing it would only buy a bar that never fires.
  - id: dsm-sju-jan-sat-thu
    origin: DSM
    destination: SJU
    depart_window:
      earliest: "2027-01-02"
      latest: "2027-01-30"
    nights: 5
    window_step_days: 7
    # $2,650: 5.25% below San Juan's $2,796 bucket floor, which is the same
    # relative break STT's $2,800 asks of its own $2,955 floor. See the Saturday
    # route above for why parity is the anchor.
    threshold_usd: 2650
    alert_on:
      - absolute_below: 2650
      - lowest_in_days: 30
      - percent_drop: 5
    # 5 dates x 2 = 10 a run.
    compare_split_booking: true
    # The $2,796 and $2,955 floors these bars came from were fares stating
    # "Checked baggage for a fee", i.e. a cabin bag included. A Basic fare
    # must not clear them.
    threshold_basis: bag_inclusive

  # January was the cheapest month of the year: median $2,970 against $3,058 to
  # $3,201 elsewhere, and the most days sitting on the $2,955 floor. Thu -> Tue
  # is 5 nights; the window steps 7 days so it lands on all four January
  # Thursdays and nothing else. Party fare only now -- Saturday out-floors it in
  # January, so the probe follows the Saturday route.
  - id: dsm-stt-jan-thursdays
    origin: DSM
    destination: STT
    depart_window:
      earliest: "2027-01-07"
      latest: "2027-01-28"
    nights: 5
    window_step_days: 7
    threshold_usd: 2800
    alert_on:
      - absolute_below: 2800
      - lowest_in_days: 30
      - percent_drop: 5
    # 4 dates x 1 = 4 a run: every January Thursday, party fare only. The
    # single-adult probe lives on the Saturday route, which out-floors this one.
    compare_split_booking: false
    # Same basis as the Saturday routes: this bar descends from a
    # bag-inclusive floor, so only a fare with a cabin bag may clear it.
    threshold_basis: bag_inclusive

  # San Juan, January midweek. Party fare only, as above.
  - id: dsm-sju-jan-thursdays
    origin: DSM
    destination: SJU
    depart_window:
      earliest: "2027-01-07"
      latest: "2027-01-28"
    nights: 5
    window_step_days: 7
    # $2,650: 5.25% below San Juan's $2,796 bucket floor, which is the same
    # relative break STT's $2,800 asks of its own $2,955 floor. See the Saturday
    # route above for why parity is the anchor.
    threshold_usd: 2650
    alert_on:
      - absolute_below: 2650
      - lowest_in_days: 30
      - percent_drop: 5
    # 4 dates x 1 = 4 a run: every January Thursday, party fare only. The
    # single-adult probe lives on the Saturday route, which out-floors this one.
    compare_split_booking: false
    # Same basis as the Saturday routes: this bar descends from a
    # bag-inclusive floor, so only a fare with a cabin bag may clear it.
    threshold_basis: bag_inclusive

  # A second look at the shoulder season. The year survey put April's median at
  # $2,985, level with January, and late April sat on the $2,955 floor on four of
  # five sampled departures; early May is patchier ($3,120 median) but May 4 and
  # May 11 both hit the floor.
  - id: dsm-stt-apr-may-thursdays
    origin: DSM
    destination: STT
    depart_window:
      earliest: "2027-04-29"   # one representative Thursday in April
      latest: "2027-05-13"     # one in May
    nights: 5                  # Thursday -> Tuesday
    window_step_days: 14       # exactly two dates: Apr 29 and May 13
    threshold_usd: 2800
    alert_on:
      - absolute_below: 2800
      - lowest_in_days: 30
      - percent_drop: 5
    # 2 dates x 1 = 2 a run. A baseline, not a search: it exists so a January
    # price can be judged as genuinely low rather than only low for January.
    # Full resolution comes back when this window becomes primary in December.
    compare_split_booking: false
    # Same basis as the Saturday routes: this bar descends from a
    # bag-inclusive floor, so only a fare with a cabin bag may clear it.
    threshold_basis: bag_inclusive

  # San Juan, shoulder midweek. The thinnest cell in the grid: new destination,
  # secondary window, weakest weekday. First to lose its searches to a short
  # cycle, and the first thing to cut if the plan ever needs the headroom.
  - id: dsm-sju-apr-may-thursdays
    origin: DSM
    destination: SJU
    depart_window:
      earliest: "2027-04-29"   # one representative Thursday in April
      latest: "2027-05-13"     # one in May
    nights: 5                  # Thursday -> Tuesday
    window_step_days: 14       # exactly two dates: Apr 29 and May 13
    # $2,650: 5.25% below San Juan's $2,796 bucket floor, which is the same
    # relative break STT's $2,800 asks of its own $2,955 floor. See the Saturday
    # route above for why parity is the anchor.
    threshold_usd: 2650
    alert_on:
      - absolute_below: 2650
      - lowest_in_days: 30
      - percent_drop: 5
    # 2 dates x 1 = 2 a run. A baseline, not a search: it exists so a January
    # price can be judged as genuinely low rather than only low for January.
    # Full resolution comes back when this window becomes primary in December.
    compare_split_booking: false
    # Same basis as the Saturday routes: this bar descends from a
    # bag-inclusive floor, so only a fare with a cabin bag may clear it.
    threshold_basis: bag_inclusive

  # ---------------------------------------------------------------------------
  # Drive-to-a-hub origins, added 2026-09-24.
  #
  # Every cheap DSM->STT itinerary connects at ORD, and on 2026-09-23 all 11 of
  # the cheapest ones carried an overnight layover, so the party already pays to
  # sit in Chicago. The question is whether starting there beats flying there.
  # Hand readings on 2026-09-23/24 say it depends entirely on the destination:
  #
  #   ORD->SJU  Jan 16-21   $1,473  vs DSM $2,650   -- $1,177 cheaper
  #   MSP->SJU  Jan 16-21   $2,131  vs DSM $2,650   --   $519 cheaper
  #   ORD->STT  Jan 23-28   $3,314  vs DSM $3,075   --   $239 DEARER
  #
  # San Juan from a hub is a different market; St. Thomas is not, because
  # American holds the STT floor from every origin tried so far. ORD->STT is
  # tracked anyway, at the coarsest resolution of the three, because one date is
  # not enough to close a question this expensive.
  #
  # The ORD reading also surfaced Frontier nonstop ORD-SJU at $1,639. Low-cost
  # carriers do not interline, so no DSM through-fare can ever show them -- the
  # blind spot src/hub_survey.py was written about, visible here for the first
  # time.
  #
  # THESE FARES ARE NOT COMPARABLE TO THE DSM ONES AS PRINTED. Driving costs the
  # party roughly $265 to ORD (333 miles each way, ~$100 fuel, ~$150 parking for
  # six days, ~$15 tolls) and roughly $170 to MSP (244 miles, cheaper parking, no
  # tolls). Subtract that before calling a hub fare a saving. It also buys a
  # January drive across Iowa carrying no missed-connection protection of any
  # kind: if weather closes the interstate the fare is simply lost, where a
  # cancelled DSM departure is the airline's problem. That risk is real and the
  # number cannot show it.
  #
  # Thresholds are provisional and anchored on ONE observation each, set 5.25%
  # below it -- the same relative break the DSM routes ask of their own floors.
  # Recalibrate once each has three readings. Until then an alert here means
  # "cheaper than the single reading we have", not "cheap". The ORD->SJU floor is
  # also a Basic fare with no carry-on, so its threshold is measuring a thinner
  # product than the DSM bars, which were calibrated on bag-inclusive fares.
  #
  # Three dates, not five: this is a comparison, not the search. Stepping 14 days
  # lands on Jan 2, 16 and 30 -- three of the five dates the DSM Saturday routes
  # price -- so the origins can be read against each other directly. They sit
  # last on purpose: a short cycle should starve these before it starves the trip
  # actually being bought. If the San Juan gap holds across all three dates,
  # ord-sju should be promoted above the DSM routes and DSM demoted to reference.
  # That is a bigger change than a threshold and wants a decision, not a default.
  - id: ord-sju-jan-sat-thu
    origin: ORD
    destination: SJU
    depart_window:
      earliest: "2027-01-02"
      latest: "2027-01-30"
    nights: 5
    window_step_days: 14
    # 5.25% below the single $1,473 reading of 2027-01-16 on 2026-09-24.
    threshold_usd: 1395
    alert_on:
      - absolute_below: 1395
      - lowest_in_days: 30
      - percent_drop: 5
    # 3 dates x 1 = 3 a run. The split-booking probe stays on the DSM Saturday
    # route until this one is more than one observation old.
    compare_split_booking: false
    # threshold_basis stays "any": this bar was anchored on a fare with NO
    # cabin bag, so demanding one would compare it against a product it was
    # never calibrated from. Revisit together with the threshold once there
    # are three readings -- ideally re-anchoring both on a bag-inclusive fare.
    threshold_basis: any

  # Minneapolis is 244 miles against Chicago's 333 and its best January fare was
  # a Delta nonstop with a carry-on included, where the cheaper ORD fares are
  # Basic. Slower on paper, better on the thing the party actually buys.
  - id: msp-sju-jan-sat-thu
    origin: MSP
    destination: SJU
    depart_window:
      earliest: "2027-01-02"
      latest: "2027-01-30"
    nights: 5
    window_step_days: 14
    # 5.25% below the single $2,131 reading of 2027-01-16 on 2026-09-24.
    threshold_usd: 2020
    alert_on:
      - absolute_below: 2020
      - lowest_in_days: 30
      - percent_drop: 5
    # 3 dates x 1 = 3 a run.
    compare_split_booking: false
    # threshold_basis stays "any": this bar was anchored on a fare with NO
    # cabin bag, so demanding one would compare it against a product it was
    # never calibrated from. Revisit together with the threshold once there
    # are three readings -- ideally re-anchoring both on a bag-inclusive fare.
    threshold_basis: any

  # The control. If this stays dearer than DSM->STT it answers the question and
  # can be dropped, which is why it is last. Jan 9, 23 and 30 -- the window
  # always prices its latest edge, so stepping 14 from Jan 9 lands on three
  # dates, not two. All three are dates the DSM Saturday route also prices.
  - id: ord-stt-jan-sat-thu
    origin: ORD
    destination: STT
    depart_window:
      earliest: "2027-01-09"
      latest: "2027-01-30"
    nights: 5
    window_step_days: 14
    # 5.25% below the single $3,314 reading of 2027-01-23 on 2026-09-24.
    threshold_usd: 3140
    alert_on:
      - absolute_below: 3140
      - lowest_in_days: 30
      - percent_drop: 5
    # 2 dates x 1 = 2 a run.
    compare_split_booking: false
    # threshold_basis stays "any": this bar was anchored on a fare with NO
    # cabin bag, so demanding one would compare it against a product it was
    # never calibrated from. Revisit together with the threshold once there
    # are three readings -- ideally re-anchoring both on a bag-inclusive fare.
    threshold_basis: any
