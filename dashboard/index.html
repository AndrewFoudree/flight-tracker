<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Public, but there is no reason for a page about one family's travel
       dates to be searchable. robots.txt says the same thing; this covers
       crawlers that arrive by link rather than by root. -->
  <meta name="robots" content="noindex, nofollow">
  <title>Flight price tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f1216;
      --panel: #171b21;
      --line: #262c35;
      --text: #e6e9ee;
      --muted: #96a0ad;
      --accent: #5aa9e6;
      --good: #58c98a;
      --warn: #e6a34a;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f6f7f9; --panel: #ffffff; --line: #e2e6eb;
        --text: #131820; --muted: #5c6875;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 2rem 1.25rem 4rem;
      background: var(--bg); color: var(--text);
      font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { max-width: 1080px; margin: 0 auto; }
    h1 { font-size: 1.4rem; margin: 0 0 .25rem; letter-spacing: -.01em; }
    .sub { color: var(--muted); margin: 0 0 2rem; font-size: .9rem; }
    .route { background: var(--panel); border: 1px solid var(--line);
             border-radius: 12px; padding: 1.25rem; margin-bottom: 1.25rem; }
    .route header { display: flex; flex-wrap: wrap; gap: .75rem 1.5rem;
                    align-items: baseline; margin-bottom: 1rem; }
    .route h2 { font-size: 1.05rem; margin: 0; }
    .route h2 small { color: var(--muted); font-weight: 400; margin-left: .5rem; }
    .stats { display: flex; flex-wrap: wrap; gap: 1.5rem; margin-left: auto; }
    .stat { text-align: right; }
    .stat .k { display: block; color: var(--muted); font-size: .72rem;
               text-transform: uppercase; letter-spacing: .06em; }
    .stat .v { font-variant-numeric: tabular-nums; font-weight: 600; }
    .v.under { color: var(--good); background: color-mix(in srgb, var(--good) 18%, transparent);
               border-radius: 999px; padding: .1rem .55rem; margin-right: -.55rem; }
    .v.over { color: var(--warn); }
    .chart { position: relative; height: 300px; }
    .note { color: var(--muted); font-size: .82rem; margin-top: .85rem; }
    .pull { margin-top: 1.4rem; border-top: 1px solid var(--line); padding-top: 1.1rem; }
    .pull h3 { font-size: .8rem; margin: 0 0 .2rem; text-transform: uppercase;
               letter-spacing: .07em; color: var(--muted); font-weight: 600; }
    .pull .when { color: var(--muted); font-size: .8rem; margin: 0 0 .8rem; }
    .scroll { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; font-size: .87rem;
            font-variant-numeric: tabular-nums; }
    th, td { text-align: right; padding: .45rem .7rem; white-space: nowrap; }
    th:first-child, td:first-child { text-align: left; }
    thead th { color: var(--muted); font-weight: 600; font-size: .72rem;
               text-transform: uppercase; letter-spacing: .05em;
               border-bottom: 1px solid var(--line); }
    tbody tr + tr td { border-top: 1px solid var(--line); }
    tbody tr.best td { background: color-mix(in srgb, var(--good) 12%, transparent); }
    /* Under the bar is the whole point of the tracker, so it outranks
       cheapest-of-this-pull, which is only ever relative. */
    tbody tr.beats td { background: color-mix(in srgb, var(--good) 26%, transparent);
                        font-weight: 600; }
    tbody tr.best td:first-child::after { content: " \2193 cheapest"; color: var(--good);
                                          font-size: .75rem; }
    td.wide { color: var(--warn); font-weight: 600; }
    td.down { color: var(--good); font-weight: 600; }
    td.up { color: var(--warn); font-weight: 600; }
    .legend { color: var(--muted); font-size: .78rem; margin: .7rem 0 0; }
    .route.beats { border-color: var(--good); box-shadow: inset 4px 0 0 var(--good); }
    .hit { margin: .7rem 0 0; padding: .5rem .7rem; font-size: .85rem; font-weight: 600;
           color: var(--good); border-radius: 4px;
           background: color-mix(in srgb, var(--good) 14%, transparent);
           border-left: 3px solid var(--good); }
    td a { color: inherit; text-decoration: underline; text-underline-offset: 2px;
           text-decoration-color: var(--muted); }
    td a:hover { text-decoration-color: var(--good); }
    td[title] { cursor: help; }
    .legend.warn { color: var(--warn); }
    .na { color: var(--warn); }
    .na-box { background: color-mix(in srgb, var(--warn) 12%, transparent);
              border-left: 3px solid var(--warn); border-radius: 4px;
              padding: .7rem .9rem; margin: 0; font-size: .87rem; }
    /* Fare baseline: reference, not a live series, so it reads quieter than a
       route card but louder than the coverage panel below it. */
    .baseline h2 small { display: block; margin: .2rem 0 0; font-size: .8rem; }
    .baseline .pair + .pair { margin-top: 1.5rem; padding-top: 1.3rem;
                              border-top: 1px solid var(--line); }
    .pair-head { display: flex; flex-wrap: wrap; gap: .5rem .8rem;
                 align-items: baseline; margin-bottom: .9rem; }
    .pair-n { color: var(--muted); font-size: .8rem; }
    /* Room above and below for the median tick and the floor marker, both of
       which overhang the bar so they read against the band rather than in it. */
    .band { position: relative; height: 10px; margin: 1.1rem 0 .4rem;
            background: color-mix(in srgb, var(--muted) 14%, transparent);
            border-radius: 999px; }
    .band-range { position: absolute; top: 0; bottom: 0;
                  background: color-mix(in srgb, var(--accent) 34%, transparent);
                  border-radius: 999px; }
    .band-tick { position: absolute; top: -4px; bottom: -4px; width: 2px;
                 margin-left: -1px; background: var(--muted); border-radius: 1px; }
    .band-mark { position: absolute; top: -7px; bottom: -7px; width: 3px;
                 margin-left: -1.5px; background: var(--good); border-radius: 2px;
                 box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 22%, transparent); }
    .band-scale { display: flex; justify-content: space-between;
                  color: var(--muted); font-size: .75rem;
                  font-variant-numeric: tabular-nums; }
    .pair-read { margin: .7rem 0 0; font-size: .87rem; }
    .pair-read strong { font-variant-numeric: tabular-nums; }
    .pair-carriers { margin: .35rem 0 0; color: var(--muted); font-size: .8rem; }
    .unseen { margin: 1.3rem 0 0; padding: .6rem .8rem; font-size: .85rem;
              border-radius: 4px; border-left: 3px solid var(--warn);
              background: color-mix(in srgb, var(--warn) 12%, transparent); }
    /* Coverage panel: diagnostic, so it reads quieter than a route card. */
    .coverage h2 small { display: block; margin: .2rem 0 0; font-size: .8rem; }
    .coverage .verdict { margin: 0 0 1rem; font-size: .87rem; padding: .6rem .8rem;
                         border-radius: 4px; border-left: 3px solid var(--muted);
                         background: color-mix(in srgb, var(--muted) 10%, transparent); }
    .coverage .verdict.good { color: var(--good); border-left-color: var(--good);
                              background: color-mix(in srgb, var(--good) 12%, transparent); }
    .coverage .verdict.warn { color: var(--warn); border-left-color: var(--warn);
                              background: color-mix(in srgb, var(--warn) 12%, transparent); }
    .coverage .verdict.muted { color: var(--muted); }
    .coverage td.muted-cell, .coverage .muted-cell { color: var(--muted); }
    .coverage tbody tr.live td { background: color-mix(in srgb, var(--accent) 12%, transparent); }
    .tag { color: var(--muted); font-size: .7rem; text-transform: uppercase;
           letter-spacing: .05em; border: 1px solid var(--line);
           border-radius: 999px; padding: .05rem .4rem; margin-left: .35rem; }
    .empty, .error { background: var(--panel); border: 1px solid var(--line);
                     border-radius: 12px; padding: 1.5rem; color: var(--muted); }
    .error { border-color: var(--warn); color: var(--warn); }
    code { background: rgba(127,127,127,.15); padding: .1em .35em; border-radius: 4px; }
    footer { color: var(--muted); font-size: .8rem; margin-top: 2rem; }
  </style>
</head>
<body>
  <main>
    <h1>Flight price tracker</h1>
    <p class="sub" id="subtitle">Loading history&hellip;</p>
    <div id="routes"></div>
    <footer>
      Prices are whole-party totals unless noted. Every point is the cheapest quote
      observed that day. Fares move; verify on the airline site before booking.
    </footer>
  </main>
  <script src="chart.js"></script>
</body>
</html>
