name: Survey a year of fares

# One-off, manual only. A year-wide sweep costs a search per sampled departure,
# so running it on a schedule would exhaust the month's allowance in an afternoon.
on:
  workflow_dispatch:
    inputs:
      origin:
        description: "Origin airport"
        default: "DSM"
      destination:
        description: "Destination airport"
        default: "STT"
      earliest:
        description: "First departure to sample (YYYY-MM-DD)"
        default: "2026-09-15"
      latest:
        description: "Last departure to sample (YYYY-MM-DD)"
        default: "2027-07-15"
      nights:
        description: "Trip length in nights"
        default: "7"
      step:
        description: "Days between sampled departures"
        default: "14"
      max_searches:
        description: "Refuse to run past this many searches"
        default: "40"

permissions:
  contents: write

concurrency:
  group: prices          # never race the daily check for the same budget
  cancel-in-progress: false

jobs:
  survey:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Sweep the year
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          python -m src.survey \
            --origin "${{ inputs.origin }}" \
            --destination "${{ inputs.destination }}" \
            --earliest "${{ inputs.earliest }}" \
            --latest "${{ inputs.latest }}" \
            --nights "${{ inputs.nights }}" \
            --step "${{ inputs.step }}" \
            --max-searches "${{ inputs.max_searches }}" \
            | tee survey-output.txt

      - name: Publish the table to the run summary
        if: always()
        run: |
          echo '## Fare survey' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat survey-output.txt >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Commit the survey data
        run: |
          git config user.name "flight-bot"
          git config user.email "flight-bot@users.noreply.github.com"
          rm -f survey-output.txt
          python scripts/commit_data.py "survey: ${{ inputs.origin }}-${{ inputs.destination }} $(date -u +%Y-%m-%d)"
