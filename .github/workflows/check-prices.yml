name: Check flight prices

on:
  schedule:
    # Once a week: 32 searches a run, at most 160 a cycle (a month can hold five
    # Sundays) against the 230 spendable of a 250 plan. When the cycle runs short
    # the run records NA rather than skipping silently, so a blind stretch shows
    # on the dashboard as a gap instead of looking like flat prices.
    - cron: "0 13 * * 0"    # Sunday 13:00 UTC, 08:00 Central (07:00 once CST starts)
  workflow_dispatch:        # manual trigger for testing
    inputs:
      route:
        description: "Limit to these route ids, comma separated (blank runs all)"
        required: false
      dry_run:
        description: "Analyse stored history without calling any API"
        type: boolean
        default: false

permissions:
  contents: write           # commit the CSV
  issues: write             # open alert issues
  pages: write              # publish the refreshed dashboard
  id-token: write

# Two runs writing data/ at once would fight over the push.
concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch and analyse
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PARTY: ${{ vars.PARTY }}
          ROUTES: ${{ inputs.route }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # main.py takes --route repeatably; expanding the input here is what
          # makes that reachable. Built as a list rather than interpolated into
          # the command so a route id can never become shell.
          args=""
          if [ -n "$ROUTES" ]; then
            IFS=','
            for route in $ROUTES; do
              if [ -n "$route" ]; then args="$args --route $route"; fi
            done
            unset IFS
          fi
          if [ "$DRY_RUN" = "true" ]; then args="$args --dry-run"; fi
          python -m src.main $args

      - name: Commit results
        if: always()          # keep partial data even when the fetch reports failure
        run: |
          git config user.name "flight-bot"
          git config user.email "flight-bot@users.noreply.github.com"
          python scripts/commit_data.py "prices: $(date -u +%Y-%m-%d)"

  # A push made with GITHUB_TOKEN does not trigger other workflows, so the daily
  # price commit can never fire publish-dashboard.yml. Deploying here instead is
  # what actually keeps the published page in step with the data.
  publish:
    needs: check
    if: always()              # a blind run still redeploys the page it has
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main         # the tip, including the commit the check job just pushed

      - name: Stage the site
        run: |
          bash scripts/stage_site.sh "$GITHUB_SHA"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
