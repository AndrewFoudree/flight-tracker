name: Check flight prices

on:
  schedule:
    - cron: "0 13 * * *"   # 13:00 UTC, roughly 08:00 Central
  workflow_dispatch:        # manual trigger for testing
    inputs:
      route:
        description: "Limit to one route id (blank runs all)"
        required: false
      dry_run:
        description: "Analyse stored history without calling any API"
        type: boolean
        default: false

permissions:
  contents: write           # commit the CSV
  issues: write             # open alert issues
  pages: write              # publish the refreshed dashboard
  id-token: write

# Two runs writing data/ at once would fight over the push.
concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch and analyse
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m src.main \
            ${{ inputs.route && format('--route {0}', inputs.route) || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commit results
        run: |
          git config user.name "flight-bot"
          git config user.email "flight-bot@users.noreply.github.com"
          python scripts/commit_data.py "prices: $(date -u +%Y-%m-%d)"

  # A push made with GITHUB_TOKEN does not trigger other workflows, so the daily
  # price commit can never fire publish-dashboard.yml. Deploying here instead is
  # what actually keeps the published page in step with the data.
  publish:
    needs: check
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main         # the tip, including the commit the check job just pushed

      - name: Stage the site
        run: |
          mkdir -p _site/data
          cp dashboard/* _site/
          cp data/prices.csv data/routes.json _site/data/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
